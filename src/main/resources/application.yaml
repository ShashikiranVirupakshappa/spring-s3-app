spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: spring-s3-app
  datasource:
    url: ${DB_URL:jdbc:mysql://my-mysql-db.cvcws8yminks.eu-north-1.rds.amazonaws.com:3306/my_mysql_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION:eu-north-1}

s3:
  bucketName: ${S3_BUCKET_NAME:test-javabro-bucket-v1}

logging:
  level:
    org.springframework.web: DEBUG
    com.javabro.springs3app: DEBUG







